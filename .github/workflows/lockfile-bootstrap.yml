name: Lockfile bootstrap
on:
  push:
    branches: [security/hardening-baseline]
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.13.0'
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.24.0 --ignore-scripts
      - name: Generate lockfile
        run: pnpm install --lockfile-only
      - name: Install from generated lockfile
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Dependency audit high/critical
        run: pnpm audit --audit-level high
      - name: Dependency audit moderate report
        continue-on-error: true
        run: pnpm audit --audit-level moderate
      - name: Unit tests
        run: pnpm test
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Commit generated lockfile
        run: |
          if [ -n "$(git status --porcelain -- pnpm-lock.yaml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: add deterministic pnpm lockfile"
            git push
          fi
